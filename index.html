<!-- Gold Ornament Pricing Calculator Generated by ChatGPT
Design an interactive HTML page for calculating and managing gold ornament pricing, using JavaScript for all local calculations and data handling. The page should include:

A visually appealing gold-themed layout to enhance user experience.

A form at the top of the page with the following input fields:

Ornament name (text input field)

Weight of the gold ornament (grams)

Gold purity selection, implemented as a dropdown menu listing common karat values (e.g. 24K, 22K, 18K), each showing corresponding purity percentages. Include an option for custom purity, allowing users to manually enter a percentage if their ornament does not match the dropdown choices.

Current price of gold per gram

Making charges per gram

GST percentage applicable on making charges

GST percentage applicable on gold price

Upon submitting the form, automatically calculate and display:

Total price of the gold before GST and any discounts

Total making charges before GST

GST amount applicable to the gold price

GST amount applicable to the making charges

Final price of the ornament after adding all charges and GST

After calculations, display an "Add" button allowing the user to save the current ornament’s details into a table. The table should present all user inputs and calculated outputs for each entry. Allow multiple ornaments to be added, with each new entry appearing as a separate row.

Ensure the interface is intuitive, responsive, and visually consistent with a gold color palette, showcasing both usability and aesthetics.

This refined prompt makes the intent, expected UI/UX, and data management requirements explicitly clear for any AI or developer. 
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Ornament Pricing Calculator</title>

<style>
    body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(to bottom right, #fff8dc, #ffd700);
        margin: 0;
        padding: 0;
        color: #5b4e27;
    }

    header {
        background: #b8860b;
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .container {
        max-width: 1100px;
        margin: 15px auto;
        padding: 15px;
        background: #fffef6;
        border-radius: 10px;
        box-shadow: 0 0 8px rgba(184, 134, 11, 0.4);
    }

    h2 {
        margin-top: 10px;
        font-size: 20px;
        color: #b8860b;
        border-left: 5px solid #b8860b;
        padding-left: 8px;
    }

    /* Responsive Form Grid */
    form {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    column-gap: 10px;   /* ← horizontal gap between fields */
    row-gap: 15px;      /* vertical spacing (keep as is or adjust) */
}

    label {
        font-weight: bold;
        font-size: 10px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #d2b48c;
        font-size: 12px;
    }

    button {
        background: #b8860b;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #a07409;
    }

    .results-box {
        background: #fff8dc;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #b8860b;
        margin-top: 20px;
    }

    /* Responsive Table Wrapper */
    .table-wrapper {
        overflow-x: auto;
        margin-top: 25px;
    }

    table {
        width: 1500px; /* Ensures table scrolls on mobile */
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
    }

    th, td {
        border: 1px solid #d2b48c;
        padding: 10px;
        text-align: center;
        font-size: 14px;
    }

    th {
        background: #b8860b;
        color: white;
        font-weight: bold;
    }

    .grand-total-row {
        background: #ffe9a3;
        font-weight: bold;
        font-size: 16px;
    }

    @media (max-width: 600px) {
        header {
            font-size: 20px;
        }
        table {
            width: 1400px;
        }
    }
    .full-width {
    width: 100%;
    max-width: 100%;
    padding: 0 10px;
}

.saved-title {
    padding-left: 15px;
    font-size: 22px;
    color: #b8860b;
    margin-top: 20px;
}

#hGapInputField {
   padding-right: 20px; /* Adds horizontal gap between input fields */
}


</style>

</head>
<body>

<header>Gold Ornament Pricing Calculator</header>

<div class="container">

    <h2>Enter Ornament Details</h2>

    <form id="goldForm">
        <div id="hGapInputField" >
            <label>Ornament Name</label>
            <input type="text" id="ornamentName" required>
        </div>

         <div id="hGapInputField" >
            <label>Weight (grams)</label>
            <input type="number" id="weight" step="0.01" required>
        </div>

        <div>
            <label>Gold Purity</label>
            <select id="puritySelect" onchange="toggleCustomPurity()">
                <option value="0.999">24K (99.9%)</option>
                <option value="0.916">22K (91.6%)</option>
                <option value="0.750">18K (75%)</option>
                <option value="custom">Custom Purity</option>
            </select>

            <input type="number" id="customPurity" placeholder="Enter purity %"
                style="display:none; margin-top:5px;">
        </div>

        <div id="hGapInputField" >
            <label>Wastage (%)</label>
            <input type="number" id="wastage" step="0.01" placeholder="e.g., 5">
        </div>

       <div id="hGapInputField" >
            <label>Gold Price per Gram</label>
            <input type="number" id="goldPrice" step="0.01" required>
        </div>

        <div id="hGapInputField" >
            <label>Making Charges per Gram</label>
            <input type="number" id="makingCharges" step="0.01" required>
        </div>

        <div id="hGapInputField" >
            <label>GST on Gold (%)</label>
            <input type="number" id="goldGst" step="0.01" required>
        </div>

        <div id="hGapInputField" >
            <label>GST on Making (%)</label>
            <input type="number" id="makingGst" step="0.01" required>
        </div>
    </form>

    <button onclick="calculatePrice()">Calculate</button>

    <div id="results" class="results-box" style="display:none;"></div>

    <button id="addBtn" style="display:none;" onclick="addToTable()">Add to Table</button>
</div>
<h2 class="saved-title">Saved Ornaments</h2>

<div class="table-wrapper full-width">
    <table id="ornamentTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Weight</th>
                    <th>Purity</th>
                    <th>Wastage %</th>
                    <th>Total Gold Before GST</th>
                    <th>Total Making</th>
                    <th>GST on Gold</th>
                    <th>GST on Making</th>
                    <th>Final Price</th>
                </tr>
            </thead>
            <tbody></tbody>

            <tfoot>
                <tr class="grand-total-row">
                    <td>Grand Total</td>
                    <td id="g_weight">0</td>
                    <td id="g_purity">0%</td>
                    <td id="g_wastage">0%</td>
                    <td id="g_gold">₹0.00</td>
                    <td id="g_making">₹0.00</td>
                    <td id="g_gst_gold">₹0.00</td>
                    <td id="g_gst_making">₹0.00</td>
                    <td id="g_final">₹0.00</td>
                </tr>
            </tfoot>
        </table>
    </div>
<script>

function toggleCustomPurity() {
    document.getElementById("customPurity").style.display =
        document.getElementById("puritySelect").value === "custom"
            ? "block"
            : "none";
}

let items = []; // store all rows

function calculatePrice() {

    const name = document.getElementById("ornamentName").value;
    const weight = parseFloat(document.getElementById("weight").value);
    const puritySelect = document.getElementById("puritySelect").value;
    const wastage = parseFloat(document.getElementById("wastage").value) || 0;
    const goldPrice = parseFloat(document.getElementById("goldPrice").value);
    const makingCharges = parseFloat(document.getElementById("makingCharges").value);
    const goldGst = parseFloat(document.getElementById("goldGst").value);
    const makingGst = parseFloat(document.getElementById("makingGst").value);

    let purity =
        puritySelect === "custom"
            ? (parseFloat(document.getElementById("customPurity").value) / 100)
            : parseFloat(puritySelect);

    const pureGoldPrice = weight * purity * goldPrice;
    const wastageAmount = pureGoldPrice * (wastage / 100);
    const totalGoldBeforeGst = pureGoldPrice + wastageAmount;
    const totalMaking = weight * makingCharges;

    const gstOnGold = (totalGoldBeforeGst * goldGst) / 100;
    const gstOnMaking = (totalMaking * makingGst) / 100;

    const finalPrice = totalGoldBeforeGst + totalMaking + gstOnGold + gstOnMaking;

    // store global
    window.lastItem = {
        name, weight, purity, wastage,
        totalGoldBeforeGst, totalMaking,
        gstOnGold, gstOnMaking, finalPrice
    };

    document.getElementById("results").style.display = "block";
    document.getElementById("results").innerHTML = `
        <h3>Calculation Results</h3>
        <p><strong>Total Gold Before GST:</strong> ₹${totalGoldBeforeGst.toFixed(2)}</p>
        <p><strong>Total Making:</strong> ₹${totalMaking.toFixed(2)}</p>
        <p><strong>GST on Gold:</strong> ₹${gstOnGold.toFixed(2)}</p>
        <p><strong>GST on Making:</strong> ₹${gstOnMaking.toFixed(2)}</p>
        <p><strong>Final Price:</strong> ₹${finalPrice.toFixed(2)}</p>
    `;

    document.getElementById("addBtn").style.display = "inline-block";
}

function addToTable() {

    items.push(window.lastItem);

    const tbody = document.getElementById("ornamentTable").querySelector("tbody");
    const row = tbody.insertRow();

    function addCell(v) {
        const cell = row.insertCell();
        cell.textContent = v;
    }

    addCell(lastItem.name);
    addCell(lastItem.weight);
    addCell((lastItem.purity * 100).toFixed(1) + "%");
    addCell(lastItem.wastage + "%");
    addCell("₹" + lastItem.totalGoldBeforeGst.toFixed(2));
    addCell("₹" + lastItem.totalMaking.toFixed(2));
    addCell("₹" + lastItem.gstOnGold.toFixed(2));
    addCell("₹" + lastItem.gstOnMaking.toFixed(2));
    addCell("₹" + lastItem.finalPrice.toFixed(2));

    updateGrandTotals();
    document.getElementById("addBtn").style.display = "none";
}

function updateGrandTotals() {

    let tWeight = 0, tPurity = 0, tWastage = 0;
    let tGold = 0, tMaking = 0, tGstGold = 0, tGstMaking = 0, tFinal = 0;

    for (let item of items) {
        tWeight += item.weight;
        tPurity += item.purity * 100;
        tWastage += item.wastage;
        tGold += item.totalGoldBeforeGst;
        tMaking += item.totalMaking;
        tGstGold += item.gstOnGold;
        tGstMaking += item.gstOnMaking;
        tFinal += item.finalPrice;
    }

    document.getElementById("g_weight").textContent = tWeight.toFixed(2);
    document.getElementById("g_purity").textContent = (tPurity / items.length).toFixed(1) + "%";
    document.getElementById("g_wastage").textContent = (tWastage).toFixed(1) + "%";
    document.getElementById("g_gold").textContent = "₹" + tGold.toFixed(2);
    document.getElementById("g_making").textContent = "₹" + tMaking.toFixed(2);
    document.getElementById("g_gst_gold").textContent = "₹" + tGstGold.toFixed(2);
    document.getElementById("g_gst_making").textContent = "₹" + tGstMaking.toFixed(2);
    document.getElementById("g_final").textContent = "₹" + tFinal.toFixed(2);
}

</script>

</body>
</html>
